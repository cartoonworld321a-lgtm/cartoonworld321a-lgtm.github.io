<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #58a6ff;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Live Location Tracker</h1>
        <p>Location coordinates updates originate directly from browser Geolocation API and are transmitted to Realtime Database.</p>
        <div class="status-badge">System Active</div>
    </div>

    <!-- Firebase Scripts (Zaroori hain taake Firebase chale) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Aap ki apni script.js file link karne ke liye -->
    <script src="script.js"></script>

</body>
</html>
